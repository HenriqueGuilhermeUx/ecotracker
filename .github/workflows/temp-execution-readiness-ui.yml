name: Temporary Execution Readiness UI Integration

on:
  push:
    branches: [agent/execution-readiness-gate-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/execution-readiness-gate-v1
          fetch-depth: 0
      - name: Locate Supply Eligibility UI and integrate Execution Readiness
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          files=[]
          for p in Path('frontend/src').glob('*.tsx'):
            s=p.read_text()
            if '<SupplyEligibilityQueue' in s:
              files.append((p,s))
          if len(files)!=1:
            raise SystemExit(f'Expected exactly one SupplyEligibilityQueue render file, found {len(files)}: {[str(p) for p,_ in files]}')
          p,s=files[0]
          import_line='import { SupplyEligibilityQueue } from "./SupplyEligibilityQueue";\n'
          if import_line not in s:
            raise SystemExit(f'Expected SupplyEligibilityQueue import not found in {p}')
          if 'ExecutionReadinessBoard' in s:
            raise SystemExit('ExecutionReadinessBoard already integrated')
          s=s.replace(import_line,import_line+'import { ExecutionReadinessBoard } from "./ExecutionReadinessBoard";\n',1)
          pattern=re.compile(r'(?P<indent>^[ \t]*)<SupplyEligibilityQueue\s*/>',re.M)
          matches=list(pattern.finditer(s))
          if len(matches)!=1:
            raise SystemExit(f'Expected one SupplyEligibilityQueue component, found {len(matches)}')
          m=matches[0]
          replacement=f'{m.group("indent")}<SupplyEligibilityQueue />\n{m.group("indent")}<ExecutionReadinessBoard />'
          s=s[:m.start()]+replacement+s[m.end():]
          p.write_text(s)
          print(f'Integrated into {p}')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/temp-execution-readiness-ui.yml
      - name: Commit UI integration
        run: |
          git config user.name "EcoTracker CI"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src .github/workflows/temp-execution-readiness-ui.yml
          git commit -m "Integrar Execution Readiness à Carbon Desk"
          git push origin HEAD:agent/execution-readiness-gate-v1
