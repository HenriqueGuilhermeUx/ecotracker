name: EcoTracker Android Play Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-play-release:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --silent

      - name: Restore permanent EcoTracker upload key from GitHub Secrets
        shell: bash
        env:
          ECOT_UPLOAD_KEYSTORE_B64: ${{ secrets.ECOT_UPLOAD_KEYSTORE_B64 }}
          ECOT_UPLOAD_STORE_PASSWORD: ${{ secrets.ECOT_UPLOAD_STORE_PASSWORD }}
          ECOT_UPLOAD_KEY_ALIAS: ${{ secrets.ECOT_UPLOAD_KEY_ALIAS }}
          ECOT_UPLOAD_KEY_PASSWORD: ${{ secrets.ECOT_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ECOT_UPLOAD_KEYSTORE_B64:?Missing ECOT_UPLOAD_KEYSTORE_B64 secret}"
          : "${ECOT_UPLOAD_STORE_PASSWORD:?Missing ECOT_UPLOAD_STORE_PASSWORD secret}"
          : "${ECOT_UPLOAD_KEY_ALIAS:?Missing ECOT_UPLOAD_KEY_ALIAS secret}"
          : "${ECOT_UPLOAD_KEY_PASSWORD:?Missing ECOT_UPLOAD_KEY_PASSWORD secret}"

          KEYSTORE="$RUNNER_TEMP/ecotracker-upload-key.jks"
          printf '%s' "$ECOT_UPLOAD_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          echo "::add-mask::$ECOT_UPLOAD_STORE_PASSWORD"
          echo "::add-mask::$ECOT_UPLOAD_KEY_PASSWORD"
          echo "ECOT_UPLOAD_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "ECOT_UPLOAD_STORE_PASSWORD=$ECOT_UPLOAD_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ECOT_UPLOAD_KEY_ALIAS=$ECOT_UPLOAD_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ECOT_UPLOAD_KEY_PASSWORD=$ECOT_UPLOAD_KEY_PASSWORD" >> "$GITHUB_ENV"

          EXPECTED_FP="06:5F:DD:F3:22:AB:DF:F2:96:67:4F:6D:24:32:46:53:A5:1C:94:C1:53:9B:5D:EF:4F:95:F8:32:F6:A6:04:EF"
          KEY_FP="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$ECOT_UPLOAD_STORE_PASSWORD" -alias "$ECOT_UPLOAD_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          test "$KEY_FP" = "$EXPECTED_FP"
          echo "Permanent upload key fingerprint verified."

      - name: Generate native Android project
        working-directory: mobile
        env:
          CI: "1"
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: https://ecotracker-api-cik7.onrender.com/api
        run: npx expo prebuild --platform android --clean

      - name: Install definitive EcoTracker launcher icons
        working-directory: mobile
        run: node install-android-icons.cjs

      - name: Verify launcher resources and blocked permissions
        shell: bash
        run: |
          set -euo pipefail
          test -f mobile/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f mobile/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          test -f mobile/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f mobile/android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'tools:node="remove"' mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.SYSTEM_ALERT_WINDOW' mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.READ_EXTERNAL_STORAGE' mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.WRITE_EXTERNAL_STORAGE' mobile/android/app/src/main/AndroidManifest.xml
          echo "Launcher and blocked-permission directives verified."

      - name: Configure permanent release signing
        shell: python
        run: |
          from pathlib import Path

          path = Path("mobile/android/app/build.gradle")
          text = path.read_text(encoding="utf-8")
          marker = "signingConfigs {"
          if marker not in text:
              raise SystemExit("signingConfigs block not found")

          upload_block = '''signingConfigs {
                  upload {
                      storeFile file(System.getenv("ECOT_UPLOAD_KEYSTORE"))
                      storePassword System.getenv("ECOT_UPLOAD_STORE_PASSWORD")
                      keyAlias System.getenv("ECOT_UPLOAD_KEY_ALIAS")
                      keyPassword System.getenv("ECOT_UPLOAD_KEY_PASSWORD")
                  }
          '''
          text = text.replace(marker, upload_block, 1)

          target = "signingConfig signingConfigs.debug"
          position = text.rfind(target)
          if position < 0:
              raise SystemExit("release signingConfig not found")
          text = text[:position] + "signingConfig signingConfigs.upload" + text[position + len(target):]
          path.write_text(text, encoding="utf-8")

      - name: Build signed AAB and APK
        working-directory: mobile/android
        env:
          CI: "1"
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: https://ecotracker-api-cik7.onrender.com/api
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Prepare release package
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/ecotracker-play-release"
          mkdir -p "$OUT"
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab "$OUT/EcoTracker-1.0.3-build4-play.aab"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$OUT/EcoTracker-1.0.3-build4-release.apk"
          (cd "$OUT" && sha256sum EcoTracker-1.0.3-build4-play.aab EcoTracker-1.0.3-build4-release.apk > SHA256SUMS.txt)

      - name: Validate final AAB and APK
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/ecotracker-play-release"
          AAB="$OUT/EcoTracker-1.0.3-build4-play.aab"
          APK="$OUT/EcoTracker-1.0.3-build4-release.apk"
          EXPECTED_FP="06:5F:DD:F3:22:AB:DF:F2:96:67:4F:6D:24:32:46:53:A5:1C:94:C1:53:9B:5D:EF:4F:95:F8:32:F6:A6:04:EF"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          echo "[CHECK] AAB signature"
          jarsigner -verify -verbose -certs "$AAB" > "$OUT/AAB-SIGNATURE.txt"
          grep -q "jar verified" "$OUT/AAB-SIGNATURE.txt"
          AAB_FP="$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          echo "AAB fingerprint: $AAB_FP" | tee "$OUT/AAB-CERTIFICATE-FINGERPRINT.txt"
          test "$AAB_FP" = "$EXPECTED_FP"

          echo "[CHECK] AAB standalone bundle and launcher"
          unzip -l "$AAB" > "$OUT/AAB-CONTENTS.txt"
          grep -q "base/assets/index.android.bundle" "$OUT/AAB-CONTENTS.txt"
          grep -q "ic_launcher" "$OUT/AAB-CONTENTS.txt"

          echo "[CHECK] APK identity"
          "$AAPT" dump badging "$APK" | tee "$OUT/APK-BADGING.txt"
          grep -q "package: name='com.alternativeventures.ecotracker'" "$OUT/APK-BADGING.txt"
          grep -q "versionCode='4'" "$OUT/APK-BADGING.txt"
          grep -q "versionName='1.0.3'" "$OUT/APK-BADGING.txt"
          grep -q "application-label:'EcoTracker'" "$OUT/APK-BADGING.txt"

          echo "[CHECK] APK permissions"
          "$AAPT" dump permissions "$APK" | tee "$OUT/APK-PERMISSIONS.txt"
          ! grep -q "android.permission.SYSTEM_ALERT_WINDOW" "$OUT/APK-PERMISSIONS.txt"
          ! grep -q "android.permission.READ_EXTERNAL_STORAGE" "$OUT/APK-PERMISSIONS.txt"
          ! grep -q "android.permission.WRITE_EXTERNAL_STORAGE" "$OUT/APK-PERMISSIONS.txt"

          echo "[CHECK] APK signature and permanent certificate"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$OUT/APK-SIGNATURE.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$OUT/APK-SIGNATURE.txt"
          APK_FP_RAW="$(grep -m1 -E 'certificate SHA-256 digest:' "$OUT/APK-SIGNATURE.txt" | sed 's/.*certificate SHA-256 digest: //')"
          APK_FP="$(echo "$APK_FP_RAW" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g;s/:$//')"
          echo "APK fingerprint: $APK_FP" | tee "$OUT/APK-CERTIFICATE-FINGERPRINT.txt"
          test "$APK_FP" = "$EXPECTED_FP"

          echo "[CHECK] APK standalone JS and production API"
          unzip -l "$APK" > "$OUT/APK-CONTENTS.txt"
          grep -q "assets/index.android.bundle" "$OUT/APK-CONTENTS.txt"
          unzip -p "$APK" assets/index.android.bundle > "$RUNNER_TEMP/index.android.bundle"
          grep -a -q "https://ecotracker-api-cik7.onrender.com/api" "$RUNNER_TEMP/index.android.bundle"
          rm "$RUNNER_TEMP/index.android.bundle"

          cat > "$OUT/VALIDATION.txt" <<EOF
          EcoTracker Android Play release validated
          Package: com.alternativeventures.ecotracker
          Version: 1.0.3
          Version code: 4
          Permanent upload certificate: $EXPECTED_FP
          AAB signed: yes
          APK signed: yes
          JavaScript bundle embedded: yes
          Production API embedded: yes
          EcoTracker launcher icon: yes
          SYSTEM_ALERT_WINDOW: removed
          READ_EXTERNAL_STORAGE: removed
          WRITE_EXTERNAL_STORAGE: removed
          Upload key included in artifact: no
          Credentials included in artifact: no
          EOF

      - name: Upload signed release package
        uses: actions/upload-artifact@v4
        with:
          name: ecotracker-1.0.3-build4-play-release
          path: ecotracker-play-release/
          if-no-files-found: error
          retention-days: 30
