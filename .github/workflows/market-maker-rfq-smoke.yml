name: EcoTracker Market Maker RFQ Smoke

on:
  pull_request:
    paths:
      - 'backend/src/demand-supply-rfq*.ts'
      - 'backend/src/demand-autopilot.ts'
      - 'backend/src/demand-matching.ts'
      - 'backend/src/supply-desk*.ts'
      - 'backend/src/eligibility-*.ts'
      - 'backend/scripts/market-maker-rfq-smoke.mjs'
      - '.github/workflows/market-maker-rfq-smoke.yml'
      - 'backend/src/market-hook.ts'
  push:
    branches: [main]
    paths:
      - 'backend/src/demand-supply-rfq*.ts'
      - 'backend/src/demand-autopilot.ts'
      - 'backend/src/demand-matching.ts'
      - 'backend/src/supply-desk*.ts'
      - 'backend/src/eligibility-*.ts'
      - 'backend/scripts/market-maker-rfq-smoke.mjs'
      - '.github/workflows/market-maker-rfq-smoke.yml'
      - 'backend/src/market-hook.ts'

jobs:
  market-maker-rfq:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecotracker_market_maker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecotracker_market_maker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Install and build backend
        working-directory: backend
        run: npm install --include=dev --silent && npm run check -- --pretty false && npm run build
      - name: Run Market Maker RFQ smoke
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ecotracker_market_maker
          NODE_ENV: test
          ECOT_DEMAND_AUTOPILOT_ENABLED: "false"
          ECOT_MAX_OFFSET_VINTAGE_AGE_YEARS: "5"
          ECOT_ELIGIBILITY_MAX_AGE_HOURS: "168"
        run: node scripts/market-maker-rfq-smoke.mjs
