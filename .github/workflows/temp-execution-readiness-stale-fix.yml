name: Temporary Execution Readiness Stale Fix

on:
  push:
    branches: [agent/execution-readiness-gate-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/execution-readiness-gate-v1
          fetch-depth: 0
      - name: Patch stale transaction semantics
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('backend/src/execution-readiness.ts')
          s=p.read_text()
          old='''  const reviewer=actor(input.reviewedBy);const validUntil=new Date(Date.now()+Number(review.authorization_ttl_hours)*3600_000);\n  return withTransaction(async client=>{'''
          new='''  const reviewer=actor(input.reviewedBy);const validUntil=new Date(Date.now()+Number(review.authorization_ttl_hours)*3600_000);\n  const transactionResult=await withTransaction(async client=>{'''
          if s.count(old)!=1: raise SystemExit('approve transaction anchor not unique')
          s=s.replace(old,new,1)
          old2='''      throw Object.assign(new Error("Execution Readiness Review ficou obsoleta após os probes"),{status:409,review:stale});'''
          new2='''      return{stale:true,review:stale};'''
          if s.count(old2)!=1: raise SystemExit('inner stale throw anchor not unique')
          s=s.replace(old2,new2,1)
          old3='''    return{review:approved,authorization,asset,preview:pre,alreadyApproved:false};\n  });\n}\n\nexport async function rejectExecutionReadinessReview'''
          new3='''    return{review:approved,authorization,asset,preview:pre,alreadyApproved:false};\n  });\n  if("stale" in transactionResult&&transactionResult.stale){\n    throw Object.assign(new Error("Execution Readiness Review ficou obsoleta após os probes"),{status:409,review:transactionResult.review});\n  }\n  return transactionResult;\n}\n\nexport async function rejectExecutionReadinessReview'''
          if s.count(old3)!=1: raise SystemExit('approve tail anchor not unique')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/temp-execution-readiness-stale-fix.yml
      - name: Commit fix
        run: |
          git config user.name "EcoTracker CI"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src/execution-readiness.ts .github/workflows/temp-execution-readiness-stale-fix.yml
          git commit -m "Persistir reviews stale antes do erro"
          git push origin HEAD:agent/execution-readiness-gate-v1
