name: EcoTracker Market Signal Operational Integrity Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run market signal operational integrity smoke
        working-directory: backend
        run: node scripts/market-signal-operational-integrity-smoke.mjs
