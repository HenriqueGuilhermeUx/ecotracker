name: EcoTracker Carbonmark Sandbox Certification Smoke

on:
  pull_request:
    paths:
      - "backend/src/carbonmark-sandbox-certification*.ts"
      - "backend/scripts/carbonmark-sandbox-certification-smoke.mjs"
      - ".github/workflows/carbonmark-sandbox-certification-smoke.yml"
      - "backend/src/market-hook.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  carbonmark-sandbox-certification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecotracker_carbonmark_sandbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ecotracker_carbonmark_sandbox"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ecotracker_carbonmark_sandbox
      NODE_ENV: test
      JWT_SECRET: carbonmark-sandbox-smoke
      ECOT_MAX_OFFSET_VINTAGE_AGE_YEARS: "5"
      ECOT_ELIGIBILITY_MAX_AGE_HOURS: "168"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Install and build backend
        working-directory: backend
        run: npm install --include=dev --silent && npm run check -- --pretty false && npm run build
      - name: Prove sandbox E2E isolation
        working-directory: backend
        run: node scripts/carbonmark-sandbox-certification-smoke.mjs
