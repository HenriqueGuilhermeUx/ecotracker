name: EcoTracker Secret Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Block hardcoded production credentials
        run: node backend/scripts/secret-guard.mjs
      - name: Verify Woovi incident-response kill switch
        run: node backend/scripts/woovi-incident-response-smoke.mjs
