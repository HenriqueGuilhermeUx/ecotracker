name: EcoTracker Demand Autopilot Smoke

on:
  pull_request:
    paths:
      - 'backend/src/demand-autopilot*.ts'
      - 'backend/src/demand-*.ts'
      - 'backend/src/eligibility-*.ts'
      - 'backend/scripts/demand-autopilot-smoke.mjs'
      - '.github/workflows/demand-autopilot-smoke.yml'
      - 'backend/src/market-hook.ts'
      - 'render.yaml'
  push:
    branches: [main]
    paths:
      - 'backend/src/demand-autopilot*.ts'
      - 'backend/src/demand-*.ts'
      - 'backend/src/eligibility-*.ts'
      - 'backend/scripts/demand-autopilot-smoke.mjs'
      - '.github/workflows/demand-autopilot-smoke.yml'
      - 'backend/src/market-hook.ts'
      - 'render.yaml'

jobs:
  demand-autopilot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecotracker_demand_autopilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecotracker_demand_autopilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Install and build backend
        working-directory: backend
        run: npm install --include=dev --silent && npm run check -- --pretty false && npm run build
      - name: Run Demand Autopilot smoke
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ecotracker_demand_autopilot
          NODE_ENV: test
          ECOT_DEMAND_AUTOPILOT_ENABLED: "false"
          ECOT_MAX_OFFSET_VINTAGE_AGE_YEARS: "5"
          ECOT_ELIGIBILITY_MAX_AGE_HOURS: "168"
        run: node scripts/demand-autopilot-smoke.mjs
