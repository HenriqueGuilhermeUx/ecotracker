name: EcoTracker Execution Readiness Smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  execution-readiness:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecotracker_execution_readiness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecotracker_execution_readiness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Install and build backend
        working-directory: backend
        run: npm install --include=dev --silent && npm run check -- --pretty false && npm run build
      - name: Run Execution Readiness smoke
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ecotracker_execution_readiness
          NODE_ENV: test
          ADMIN_EMAIL: carbon-desk@ecotracker.test
          ECOT_MAX_OFFSET_VINTAGE_AGE_YEARS: "5"
          ECOT_ELIGIBILITY_MAX_AGE_HOURS: "168"
        run: node scripts/execution-readiness-smoke.mjs
