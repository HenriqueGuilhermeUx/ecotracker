name: EcoTracker iOS JS preflight (unsigned)

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-js-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expo-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Expo dependencies
        run: npm install --no-audit --no-fund
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Export unsigned iOS JavaScript
        run: npx expo export --platform ios --output-dir dist-ios-preflight
      - name: Archive bundle for QA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ecotracker-ios-js-bundle
          path: mobile/dist-ios-preflight/
          retention-days: 7
