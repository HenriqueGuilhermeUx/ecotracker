name: EcoTracker CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Backend install
        working-directory: backend
        run: npm install --include=dev --silent

      - name: Backend typecheck
        working-directory: backend
        run: npm run check -- --pretty false

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Frontend install
        working-directory: frontend
        run: npm install --silent

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Mobile install
        working-directory: mobile
        run: npm install --silent

      - name: Mobile typecheck
        working-directory: mobile
        run: npm run typecheck -- --pretty false

      - name: Mobile Android bundle
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://ecotracker-api-cik7.onrender.com/api
        run: npx expo export --platform android --output-dir dist
