name: EcoTracker CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Backend install
        working-directory: backend
        run: npm install --include=dev --silent

      - name: Backend typecheck
        id: backend_typecheck
        working-directory: backend
        shell: bash
        run: |
          set +e
          npm run check -- --pretty false > backend-typecheck.log 2>&1
          status=$?
          cat backend-typecheck.log
          exit $status

      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-typecheck-log
          path: backend/backend-typecheck.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Frontend install
        working-directory: frontend
        run: npm install --silent

      - name: Frontend build
        working-directory: frontend
        run: npm run build
