name: EcoTracker CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecotracker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecotracker_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Backend install
        working-directory: backend
        run: npm install --include=dev --silent

      - name: Backend typecheck
        working-directory: backend
        run: npm run check -- --pretty false

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: PostgreSQL base schema smoke
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ecotracker_ci
          NODE_ENV: test
        run: |
          node --input-type=module <<'NODE'
          import { initDb, pool } from './dist/db.js';
          import { initMarketDb } from './dist/market-db.js';
          import { initEligibilityDb } from './dist/eligibility-db.js';
          import { initCommerceDb } from './dist/commerce-db.js';
          import { initAssistedSourcingDb } from './dist/assisted-sourcing-db.js';
          import { initSupplyDeskDb } from './dist/supply-desk-db.js';
          import { initDemandDeskDb } from './dist/demand-desk-db.js';
          import { initDemandProposalDb } from './dist/demand-proposal-db.js';
          import { initCorporateBasketDb } from './dist/corporate-basket-db.js';
          try {
            await initDb(); console.log('initDb OK');
            await initMarketDb(); console.log('initMarketDb OK');
            await initEligibilityDb(); console.log('initEligibilityDb OK');
            await initCommerceDb(); console.log('initCommerceDb OK');
            await initAssistedSourcingDb(); console.log('initAssistedSourcingDb OK');
            await initSupplyDeskDb(); console.log('initSupplyDeskDb OK');
            await initDemandDeskDb(); console.log('initDemandDeskDb OK');
            await initDemandProposalDb(); console.log('initDemandProposalDb OK');
            await initCorporateBasketDb(); console.log('initCorporateBasketDb OK');
          } finally {
            await pool.end();
          }
          NODE

      - name: PostgreSQL demand autopilot schema smoke
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ecotracker_ci
          NODE_ENV: test
          ECOT_DEMAND_AUTOPILOT_ENABLED: "false"
        run: |
          node --input-type=module <<'NODE'
          import { pool } from './dist/db.js';
          import { initDemandAutopilotDb } from './dist/demand-autopilot-db.js';
          import { demandAutopilotStatus } from './dist/demand-autopilot.js';
          try {
            await initDemandAutopilotDb();
            const status = await demandAutopilotStatus();
            if (status.live !== false || status.databaseEnabled !== false) {
              throw new Error(`Demand Autopilot deveria iniciar desligado: ${JSON.stringify(status)}`);
            }
            const columns = await pool.query(`
              SELECT column_name FROM information_schema.columns
              WHERE table_name='demand_opportunities'
                AND column_name IN ('autopilot_key','autopilot_run_id','autopilot_metadata')
              ORDER BY column_name`);
            if (columns.rows.length !== 3) throw new Error('Colunas do Demand Autopilot ausentes em demand_opportunities');
            console.log('Demand Autopilot DB smoke OK:', { live:status.live,columns:columns.rows.map((row) => row.column_name) });
          } finally {
            await pool.end();
          }
          NODE

      - name: PostgreSQL basket payment schema smoke
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ecotracker_ci
          NODE_ENV: test
          CORPORATE_BASKET_PAYMENT_ENABLED: "false"
          CORPORATE_BASKET_PAYMENT_ACK: DISABLED
        run: |
          node --input-type=module <<'NODE'
          import { pool } from './dist/db.js';
          import { initCorporateBasketPaymentDb, corporateBasketPaymentStatus } from './dist/corporate-basket-payment-db.js';
          try {
            await initCorporateBasketPaymentDb();
            const payment = await corporateBasketPaymentStatus();
            if (payment.live !== false || payment.database?.payment_enabled !== false) {
              throw new Error(`Basket payment deveria iniciar desligado: ${JSON.stringify(payment)}`);
            }
            const triggers = await pool.query(`
              SELECT tgname FROM pg_trigger
              WHERE NOT tgisinternal
                AND tgname IN ('guard_basket_checkout_disabled','guard_basket_asset_reservation','guard_reserved_basket_leg_mutation')
              ORDER BY tgname
            `);
            const names = triggers.rows.map((row) => row.tgname);
            for (const expected of ['guard_basket_checkout_disabled','guard_basket_asset_reservation','guard_reserved_basket_leg_mutation']) {
              if (!names.includes(expected)) throw new Error(`Trigger ausente: ${expected}`);
            }
            console.log('Basket Payment DB smoke OK:', { basketPaymentLive: payment.live, triggers: names });
          } finally {
            await pool.end();
          }
          NODE

      - name: PostgreSQL final modules smoke
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ecotracker_ci
          NODE_ENV: test
        run: |
          node --input-type=module <<'NODE'
          import { pool } from './dist/db.js';
          import { initPrivacyDb } from './dist/privacy-db.js';
          import { initSourcingAutopilotDb } from './dist/sourcing-autopilot.js';
          try {
            await initPrivacyDb(); console.log('initPrivacyDb OK');
            await initSourcingAutopilotDb(); console.log('initSourcingAutopilotDb OK');
          } finally {
            await pool.end();
          }
          NODE

      - name: Frontend install
        working-directory: frontend
        run: npm install --silent

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend API proxy smoke check
        run: |
          test -f frontend/dist/_redirects
          grep -F '/api/*  https://ecotracker-api-cik7.onrender.com/api/:splat  200!' frontend/dist/_redirects
          grep -F 'ecotracker-api-cik7.onrender.com/api' frontend/src/api.ts
          grep -F '/api/*' netlify.toml

      - name: Production marketplace smoke check
        if: github.event_name == 'push'
        run: |
          node <<'NODE'
          const url = 'https://ecotracker10.netlify.app/api/market/catalog/eligibility';
          let lastError = new Error('Marketplace de produção não validado');
          for (let attempt = 1; attempt <= 18; attempt += 1) {
            try {
              const response = await fetch(url, {
                headers: { accept: 'application/json', 'cache-control': 'no-cache' },
              });
              const contentType = response.headers.get('content-type') || '';
              if (!contentType.includes('application/json')) {
                throw new Error(`content-type=${contentType || 'ausente'} status=${response.status}`);
              }
              const data = await response.json();
              if (!response.ok) throw new Error(`status=${response.status} body=${JSON.stringify(data)}`);
              if (!Array.isArray(data.verifiedCompensation)) {
                throw new Error('verifiedCompensation ausente no catálogo');
              }
              if (data.verifiedCompensation.length < 1) {
                throw new Error('verifiedCompensation vazio');
              }
              console.log(`Marketplace de produção OK: ${data.verifiedCompensation.length} lotes verificados`);
              process.exit(0);
            } catch (error) {
              lastError = error instanceof Error ? error : new Error(String(error));
              console.log(`Tentativa ${attempt}/18: ${lastError.message}`);
              if (attempt < 18) await new Promise((resolve) => setTimeout(resolve, 10000));
            }
          }
          throw lastError;
          NODE

      - name: Mobile install
        working-directory: mobile
        run: npm install --silent

      - name: Mobile typecheck
        working-directory: mobile
        run: npm run typecheck -- --pretty false

      - name: Mobile Android bundle
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://ecotracker-api-cik7.onrender.com/api
        run: npx expo export --platform android --output-dir dist
