name: EcoTracker PWA CI
on:
  pull_request:
  push:
    branches:
      - pwa-rollout-2026-10-11
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --workspace frontend --silent --no-audit --no-fund
      - run: npm run build --workspace frontend
      - run: npm install --prefix mobile --silent --no-audit --no-fund
      - run: npm run typecheck --prefix mobile
      - run: EXPO_PUBLIC_API_URL=/api npm run build:web --prefix mobile
      - run: node scripts/merge-mobile-pwa.mjs
      - name: Validate merged PWA
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/app/index.html
          test -f frontend/dist/app/manifest.webmanifest
          test -f frontend/dist/app/sw.js
          grep -q 'EcoTracker' frontend/dist/app/manifest.webmanifest
