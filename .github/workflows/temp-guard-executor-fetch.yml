name: Temporary Guard Executor Fetch

on:
  push:
    branches: [agent/execution-readiness-gate-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/execution-readiness-gate-v1
          fetch-depth: 0
      - name: Instrument executor call sites
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          targets=[]
          for p in Path('backend/src').glob('*.ts'):
            if p.name in {'execution-readiness.ts','guarded-executor-fetch.ts'}:
              continue
            s=p.read_text()
            if ('SOURCE_EXECUTOR_URL' in s or 'RETIREMENT_EXECUTOR_URL' in s) and re.search(r'(?<![\w.])fetch\s*\(',s):
              targets.append((p,s))
          if not targets:
            raise SystemExit('No executor HTTP call sites found to guard')
          changed=[]
          for p,s in targets:
            if 'guardedExecutorFetch' in s:
              continue
            imports=list(re.finditer(r'^import .*?;\s*$',s,re.M))
            if not imports:
              raise SystemExit(f'No import anchor in {p}')
            pos=imports[-1].end()
            s=s[:pos]+'\nimport { guardedExecutorFetch } from "./guarded-executor-fetch.js";'+s[pos:]
            s,count=re.subn(r'(?<![\w.])fetch\s*\(', 'guardedExecutorFetch(', s)
            if count<1:
              raise SystemExit(f'Expected fetch replacements in {p}')
            p.write_text(s)
            changed.append((str(p),count))
          if not changed:
            raise SystemExit('Executor call sites were already guarded')
          print('Guarded:',changed)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/temp-guard-executor-fetch.yml
      - name: Commit runtime guard
        run: |
          git config user.name "EcoTracker CI"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src .github/workflows/temp-guard-executor-fetch.yml
          git commit -m "Aplicar runtime guard antes dos executores"
          git push origin HEAD:agent/execution-readiness-gate-v1
