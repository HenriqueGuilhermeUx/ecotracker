name: EcoTracker Android Standalone APK

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --silent

      - name: Generate native Android project
        working-directory: mobile
        env:
          CI: "1"
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: https://ecotracker-api-cik7.onrender.com/api
        run: npx expo prebuild --platform android --clean

      - name: Install definitive EcoTracker launcher icons
        working-directory: mobile
        run: node install-android-icons.cjs

      - name: Verify launcher resources before build
        run: |
          test -f mobile/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f mobile/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          test -f mobile/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f mobile/android/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' mobile/android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' mobile/android/app/src/main/AndroidManifest.xml

      - name: Build standalone release APK
        working-directory: mobile/android
        env:
          CI: "1"
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: https://ecotracker-api-cik7.onrender.com/api
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify standalone JavaScript bundle
        run: |
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" > /tmp/ecotracker-apk-files.txt
          grep -q "assets/index.android.bundle" /tmp/ecotracker-apk-files.txt
          echo "Standalone JavaScript bundle verified. Launcher resources were validated before Android resource optimization."

      - name: Prepare artifact
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk EcoTracker-Standalone-Release.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: ecotracker-standalone-release-apk
          path: EcoTracker-Standalone-Release.apk
          if-no-files-found: error
          retention-days: 30
