name: Probe production sourcing

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe EcoTracker production sourcing
        shell: bash
        run: |
          set -u
          BASE="https://ecotracker-api-cik7.onrender.com"

          for attempt in $(seq 1 28); do
            health_code=$(curl -sS --max-time 20 -o health.json -w '%{http_code}' "$BASE/api/health" || true)
            x402_code=$(curl -sS --max-time 90 -o x402-status.json -w '%{http_code}' "$BASE/api/market/klima-x402/status" || true)
            cfc_present=$(jq -r 'has("cfcEnrichment")' x402-status.json 2>/dev/null || echo false)
            if [ "$health_code" = "200" ] && [ "$x402_code" = "200" ] && [ "$cfc_present" = "true" ]; then
              echo "CFC production deployment healthy on attempt $attempt"
              break
            fi
            echo "attempt=$attempt health=$health_code x402=$x402_code cfcEnrichment=$cfc_present"
            if [ "$attempt" -eq 28 ]; then
              echo "production did not reach CFC enriched deployment in probe window"
            else
              sleep 15
            fi
          done

          fetch() {
            name="$1"
            path="$2"
            code=$(curl -sS --max-time 150 -o "$name.json" -w '%{http_code}' "$BASE$path" || true)
            echo "$code" > "$name.status"
            echo "$name HTTP $code"
          }

          fetch sourcing-health /api/market/sourcing/health
          fetch sourcing-status /api/market/sourcing/status
          fetch gold-standard-status /api/market/gold-standard/status
          fetch x402-status /api/market/klima-x402/status
          fetch carbonmark-status /api/market/carbonmark/status
          fetch assets /api/market/assets
          fetch compensation-1kg '/api/market/compensation-assets?kg=1'
          fetch compensation-1000kg '/api/market/compensation-assets?kg=1000'

          echo '=== HTTP STATUS ==='
          for f in *.status; do echo "$f=$(cat "$f")"; done

          echo '=== SOURCING HEALTH ==='
          jq -c '{status,summary:{totalActiveAssets:.summary.totalActiveAssets,verifiedCompensationAssets:.summary.verifiedCompensationAssets,executableCompensationAssets:.summary.executableCompensationAssets,fractionalCompensationAssets:.summary.fractionalCompensationAssets,climateContributionAssets:.summary.climateContributionAssets,restrictedAssets:.summary.restrictedAssets,minimumVerifiedTarget:.summary.minimumVerifiedTarget,needsReplenishment:.summary.needsReplenishment,needsFractionalSource:.summary.needsFractionalSource},alerts}' sourcing-health.json 2>/dev/null || cat sourcing-health.json

          echo '=== SOURCING STATUS ==='
          jq -c '{totalActiveAssets,verifiedCompensationAssets,executableCompensationAssets,fractionalCompensationAssets,climateContributionAssets,restrictedAssets,minimumVerifiedTarget,needsReplenishment,needsFractionalSource,providersHealthy,providersDegraded,klimaX402}' sourcing-status.json 2>/dev/null || cat sourcing-status.json

          echo '=== X402 STATUS ==='
          jq -c . x402-status.json 2>/dev/null || cat x402-status.json

          echo '=== VERIFIED COMPENSATION @ 1 KG ==='
          jq -c '{count:length,assets:[.[]|{id,registry,project_name,vintage,available_tons,min_order_kg,execution_mode,pricing_mode,sourcing_score,sourcing_tier,sourcing_executable,fractional_retirement_supported,retirement_granularity_kg,eligibilityDecision}]}' compensation-1kg.json 2>/dev/null || cat compensation-1kg.json

          echo '=== VERIFIED COMPENSATION @ 1000 KG ==='
          jq -c '{count:length,assisted:map(select(.execution_mode=="assisted"))|length,programmatic:map(select(.execution_mode=="programmatic"))|length,executable:map(select(.sourcing_executable==true))|length}' compensation-1000kg.json 2>/dev/null || cat compensation-1000kg.json

          echo '=== CFC ASSETS RAW ==='
          jq -c '[.[] | select((.monitor_details.cfcEnrichment // null) != null) | {id,registry,project_name,source_reference,vintage,available_tons,min_order_kg,pricing_mode,availability_status,claim_category,eligibility_status,source_unit_status,retirement_supported,fractional_retirement_supported,retirement_granularity_kg,beneficiary_retirement_supported,sourcing_score,sourcing_tier,sourcing_shelf,sourcing_executable,cfcEnrichment:.monitor_details.cfcEnrichment,riskFlags:.eligibility_risk_flags}]' assets.json 2>/dev/null || true

      - name: Upload probe JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecotracker-production-sourcing-probe
          path: |
            *.json
            *.status
          if-no-files-found: warn
