name: Probe production sourcing

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe EcoTracker production sourcing
        shell: bash
        run: |
          set -u
          BASE="https://ecotracker-api-cik7.onrender.com"

          for attempt in $(seq 1 24); do
            health_code=$(curl -sS --max-time 20 -o health.json -w '%{http_code}' "$BASE/api/health" || true)
            x402_code=$(curl -sS --max-time 60 -o x402-status.json -w '%{http_code}' "$BASE/api/market/klima-x402/status" || true)
            if [ "$health_code" = "200" ] && [ "$x402_code" = "200" ]; then
              echo "production + x402 healthy on attempt $attempt"
              break
            fi
            echo "attempt=$attempt health=$health_code x402=$x402_code"
            if [ "$attempt" -eq 24 ]; then
              echo "production did not reach full provider health in probe window"
            else
              sleep 15
            fi
          done

          fetch() {
            name="$1"
            path="$2"
            code=$(curl -sS --max-time 150 -o "$name.json" -w '%{http_code}' "$BASE$path" || true)
            echo "$code" > "$name.status"
            echo "$name HTTP $code"
          }

          fetch sourcing-health /api/market/sourcing/health
          fetch sourcing-status /api/market/sourcing/status
          fetch gold-standard-status /api/market/gold-standard/status
          fetch x402-status /api/market/klima-x402/status
          fetch carbonmark-status /api/market/carbonmark/status
          fetch assets /api/market/assets

          echo '=== HTTP STATUS ==='
          for f in *.status; do echo "$f=$(cat "$f")"; done

          echo '=== HEALTH ==='
          cat health.json 2>/dev/null || true
          echo

          if jq -e . sourcing-health.json >/dev/null 2>&1; then
            echo '=== SOURCING HEALTH ==='
            jq -c '{status,summary:{totalActiveAssets:.summary.totalActiveAssets,verifiedCompensationAssets:.summary.verifiedCompensationAssets,executableCompensationAssets:.summary.executableCompensationAssets,fractionalCompensationAssets:.summary.fractionalCompensationAssets,climateContributionAssets:.summary.climateContributionAssets,restrictedAssets:.summary.restrictedAssets,minimumVerifiedTarget:.summary.minimumVerifiedTarget,needsReplenishment:.summary.needsReplenishment,needsFractionalSource:.summary.needsFractionalSource},latestRun,alerts}' sourcing-health.json
          fi

          if jq -e . sourcing-status.json >/dev/null 2>&1; then
            echo '=== SOURCING STATUS ==='
            jq -c '{totalActiveAssets,verifiedCompensationAssets,executableCompensationAssets,fractionalCompensationAssets,climateContributionAssets,restrictedAssets,minimumVerifiedTarget,needsReplenishment,needsFractionalSource,providersHealthy,providersDegraded,blockers,nearMissCandidates:(.nearMissCandidates[0:8]),carbonmark,goldStandard,klimaX402}' sourcing-status.json
          fi

          echo '=== PROVIDER STATUS ==='
          for f in gold-standard-status x402-status carbonmark-status; do
            echo "--- $f"
            jq -c . "$f.json" 2>/dev/null || cat "$f.json" 2>/dev/null || true
          done

          if jq -e 'type == "array"' assets.json >/dev/null 2>&1; then
            echo '=== ASSET COUNTS BY SOURCE ==='
            jq -c '{
              total:length,
              carbonmarkClassic:map(select((.source_reference // "")|startswith("carbonmark-")))|length,
              klimaX402:map(select((.source_reference // "")|startswith("klima-x402-")))|length,
              goldStandardMarketplace:map(select((.source_reference // "")|startswith("gold-standard-marketplace-")))|length,
              regen:map(select((.source_reference // "")|startswith("regen-")))|length,
              other:map(select(((.source_reference // "")|startswith("carbonmark-")|not) and ((.source_reference // "")|startswith("klima-x402-")|not) and ((.source_reference // "")|startswith("gold-standard-marketplace-")|not) and ((.source_reference // "")|startswith("regen-")|not)))|length
            }' assets.json

            echo '=== GOLD STANDARD CANDIDATES ==='
            jq -c '[.[] | select((.source_reference // "")|startswith("gold-standard-marketplace-")) | {
              id,project_name,vintage,available_tons,min_order_kg,source_price_usd_ton,availability_status,source_status,
              claim_category,eligibility_status,source_unit_status,retirement_supported,beneficiary_retirement_supported,
              registry_evidence_url,sourcing_score,sourcing_tier,sourcing_shelf,sourcing_executable,
              riskFlags:.eligibility_risk_flags
            }] | sort_by(-(.sourcing_score|tonumber? // 0)) | .[0:30]' assets.json

            echo '=== RECENT-VINTAGE GOLD STANDARD ==='
            jq -c '[.[] | select((.source_reference // "")|startswith("gold-standard-marketplace-")) | select((.vintage // "")|test("2021|2022|2023|2024|2025|2026")) | {id,project_name,vintage,available_tons,source_price_usd_ton,availability_status,registry_evidence_url,riskFlags:.eligibility_risk_flags}]' assets.json
          fi

      - name: Upload probe JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecotracker-production-sourcing-probe
          path: |
            *.json
            *.status
          if-no-files-found: warn
