name: EcoTracker iOS TestFlight config gate (read only)

on:
  pull_request:
    paths:
      - 'mobile/app.json'
      - 'mobile/eas.json'
      - 'mobile/package.json'
      - 'scripts/ios/check-testflight-config.mjs'
      - '.github/workflows/ios-testflight-config-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate iOS source config (no Apple credentials)
        run: node scripts/ios/check-testflight-config.mjs
