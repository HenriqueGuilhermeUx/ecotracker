name: EcoTracker Launch Readiness Smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  launch-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Verify public launch surface and safety gates
        run: node backend/scripts/launch-readiness-smoke.mjs
