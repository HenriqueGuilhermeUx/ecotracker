name: EcoTracker RFQ Market Signals Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run RFQ market signals smoke
        working-directory: backend
        run: node scripts/rfq-market-signals-smoke.mjs
