services:
  - type: web
    name: ecotracker-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ecotracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_APP_URL
        value: https://ecotracker10.netlify.app
      - key: PUBLIC_API_URL
        value: https://ecotracker-api-cik7.onrender.com
      - key: ECOT_MIN_SERVICE_FEE_BRL
        value: "29.90"
      - key: ECOT_QUOTE_TTL_MINUTES
        value: "15"
      - key: ECOT_PIX_FEE_PCT
        value: "0"
      - key: ECOT_CARD_FEE_PCT
        value: "0"
      - key: ECOT_TAX_RESERVE_PCT
        value: "0"
      - key: ECOT_MARKUP_1_24_PCT
        value: "40"
      - key: ECOT_MIN_FEE_1_24_BRL
        value: "2.90"
      - key: ECOT_MARKUP_25_99_PCT
        value: "35"
      - key: ECOT_MIN_FEE_25_99_BRL
        value: "4.90"
      - key: ECOT_MARKUP_100_999_PCT
        value: "25"
      - key: ECOT_MIN_FEE_100_999_BRL
        value: "9.90"
      - key: ECOT_MARKUP_1000_9999_PCT
        value: "20"
      - key: ECOT_MIN_FEE_1000_9999_BRL
        value: "29.90"
      - key: ECOT_MARKUP_10000_PLUS_PCT
        value: "15"
      - key: ECOT_MIN_FEE_10000_PLUS_BRL
        value: "0"
      - key: ECOT_MAX_OFFSET_VINTAGE_AGE_YEARS
        value: "5"
      - key: ECOT_ELIGIBILITY_MAX_AGE_HOURS
        value: "168"
      - key: ECOT_MIN_VERIFIED_OFFSET_ASSETS
        value: "5"
      - key: ECOT_SOURCING_RANK_MAX_AGE_MS
        value: "60000"
      - key: ECOT_SOURCING_AUTOPILOT_DISABLED
        value: "false"
      - key: ECOT_SOURCING_AUTOPILOT_INTERVAL_MS
        value: "600000"
      - key: ECOT_SOURCING_REPLENISH_MIN_INTERVAL_MS
        value: "900000"
      - key: ECOT_SOURCING_RUN_RETENTION_DAYS
        value: "30"
      - key: REGEN_PUBLISHED_ORDER_LIMIT
        value: "20"
      - key: COMMERCE_WORKER_INTERVAL_MS
        value: "15000"
      - key: CARBONMARK_ENVIRONMENT
        value: sandbox
      - key: CARBONMARK_API_BASE
        value: https://v19.api.carbonmark.com
      - key: CARBONMARK_PUBLISHED_LISTING_LIMIT
        value: "100"
      - key: CARBONMARK_API_KEY
        sync: false
      - key: KLIMA_X402_BASE_URL
        value: https://x402.klimalabs.com
      - key: KLIMA_X402_PUBLISHED_CREDIT_LIMIT
        value: "100"
      - key: KLIMA_X402_EXECUTION_ENABLED
        value: "false"
      - key: WOOVI_APP_ID
        sync: false
      - key: WOOVI_WEBHOOK_SECRET
        generateValue: true
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_USE_SANDBOX
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SOURCE_EXECUTOR_URL
        sync: false
      - key: SOURCE_EXECUTOR_TOKEN
        sync: false
      - key: RETIREMENT_EXECUTOR_URL
        sync: false
      - key: RETIREMENT_EXECUTOR_TOKEN
        sync: false
      - key: DELIVERY_EXECUTOR_URL
        sync: false
      - key: DELIVERY_EXECUTOR_TOKEN
        sync: false
      - key: NFSE_PROVIDER_URL
        sync: false
      - key: NFSE_PROVIDER_TOKEN
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: BASE_RPC_URL
        sync: false
      - key: BLOCKCHAIN_PRIVATE_KEY
        sync: false
      - key: REGISTRY_CONTRACT_ADDRESS
        sync: false

databases:
  - name: ecotracker-db
    plan: free
    region: oregon
    databaseName: ecotracker
    user: ecotracker
    ipAllowList: []
