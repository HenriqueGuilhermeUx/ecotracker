[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

# A API fica disponível no mesmo domínio do frontend.
# Isso elimina divergência de VITE_API_URL e problemas de CORS.
[[redirects]]
  from = "/api/*"
  to = "https://ecotracker-api-cik7.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    X-EcoTracker-Origin = "ecotracker10-netlify"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    X-EcoTracker-Origin = "ecotracker10-netlify"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
